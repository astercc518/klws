# Evolution API v2 一次性验证沙盒（配 docs/evolution-real-machine-verification-runbook.md）
# 用法：
#   docker compose -f docs/four-phase-demo/evo-verify/docker-compose.yml up -d
#   export EVO=http://localhost:8080 KEY=verify-key-123
#   curl -s $EVO/ -H "apikey: $KEY" | head    # 冒烟
services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7   # 镜像名迁移 atendai→evoapicloud + v2.1.1 Baileys 被 WhatsApp 淘汰(405),v2.3.x 起可握手(真机验证 2026-07-15)
    ports: ["8080:8080"]
    environment:
      - AUTHENTICATION_API_KEY=verify-key-123      # = EvoClient 的 apikey
      # v2 用 Prisma 强制要 PostgreSQL（DATABASE_ENABLED=false 是 v1 式配置，
      # v2.1.1 会 "Database provider invalid" 退出）——真机验证发现。
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evo:evo@postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_verify
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/0
      - CACHE_REDIS_PREFIX_KEY=evo
      # 我们用 webhook.headers.authorization 做鉴权（v2 不签名 body）——沙盒里
      # 由 create 请求带进去，不用全局配置。
    depends_on: [redis, postgres]
  redis:
    image: redis:7-alpine
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=evo
      - POSTGRES_PASSWORD=evo
      - POSTGRES_DB=evolution

  # 抓 Evolution 回调原始 body + 头（对拍 payload 形状与 Authorization 头的关键）。
  webhook-capture:
    build: .
    ports: ["9999:9999"]
