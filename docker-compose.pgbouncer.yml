# PgBouncer transaction-mode overlay (tracked, generic — NO machine-local volumes/hash).
# 上线随 two-/three-file 一起挂:
#   docker compose -f docker-compose.prod.yml -f docker-compose.pgbouncer.yml [-f docker-compose.adopt.yml] up -d
# app 侧须置 WADIST_PG_POOL_MODE=pgbouncer + WADIST_OWNERSHIP_BACKEND=redis,
# 且 WADIST_POSTGRES_DSN 指向 pgbouncer:6432。
# NOTE: 本机无真 PgBouncer,未做集成测;prod postgres 服务名=postgres (app/app/wadist)。
services:
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: always
    environment:
      DB_HOST: postgres
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: wadist
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "50"
      AUTH_TYPE: plain
    depends_on: [postgres]
    ports: ["6432:6432"]
