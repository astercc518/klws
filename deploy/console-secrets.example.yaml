# 控制台密钥模板 —— 仅占位示例,请勿把真实值提交进仓库。
# 真实密钥用下方 kubectl 命令创建(不落盘到 git),或用 sealed-secrets / external-secrets 管理。
#
# ============================================================================
# 1) 应用密钥 wadist-console-secrets(3 个 DSN + 三把密钥)
# ============================================================================
# 用命令创建(推荐,密钥不进仓库):
#
#   kubectl create secret generic wadist-console-secrets \
#     --from-literal=WADIST_POSTGRES_DSN='postgres://app:***@postgres:5432/wadist?sslmode=require' \
#     --from-literal=WADIST_APP_TENANT_DSN='postgres://app_tenant:***@postgres:5432/wadist?sslmode=require' \
#     --from-literal=WADIST_APP_SYSTEM_DSN='postgres://app_system:***@postgres:5432/wadist?sslmode=require' \
#     --from-literal=WADIST_CONSOLE_SESSION_KEY="$(openssl rand -base64 32)" \
#     --from-literal=WADIST_MASTER_KEY="$(openssl rand -base64 32)" \
#     --from-literal=WADIST_BLIND_INDEX_KEY="$(openssl rand -base64 32)"
#
# 说明:
#   - 三个 DSN 必须分别是超级用户池 / app_tenant(RLS)/ app_system(BYPASSRLS),不可混用。
#   - SESSION_KEY 需 base64、解码后 >=32 字节;MASTER_KEY / BLIND_INDEX_KEY 需 base64 的恰好 32 字节。
#   - 不设 BLIND_INDEX_KEY 则 /send 发送端点 fail-closed(ErrSendNotConfigured)。
#
# 占位等价 YAML(stringData,仅供参考,值请替换):
apiVersion: v1
kind: Secret
metadata:
  name: wadist-console-secrets
type: Opaque
stringData:
  WADIST_POSTGRES_DSN: "REPLACE_ME"
  WADIST_APP_TENANT_DSN: "REPLACE_ME"
  WADIST_APP_SYSTEM_DSN: "REPLACE_ME"
  WADIST_CONSOLE_SESSION_KEY: "REPLACE_ME_base64_>=32B"
  WADIST_MASTER_KEY: "REPLACE_ME_base64_32B"
  WADIST_BLIND_INDEX_KEY: "REPLACE_ME_base64_32B"
---
# ============================================================================
# 2) TLS 证书 Secret klws-cc-tls(Cloudflare Origin 证书)
# ============================================================================
# 用命令创建(私钥不进仓库):
#
#   kubectl create secret tls klws-cc-tls \
#     --cert=klws.cc.pem \
#     --key=klws.cc.key
#
# ⚠️ 当前这把 Origin 私钥已在聊天中泄露,上线前务必在 Cloudflare 重新生成后再创建本 Secret。
#
# 占位等价 YAML(请用上面的命令代替,勿提交真实私钥):
apiVersion: v1
kind: Secret
metadata:
  name: klws-cc-tls
type: kubernetes.io/tls
stringData:
  tls.crt: "REPLACE_ME_PEM_CERT"
  tls.key: "REPLACE_ME_PEM_PRIVATE_KEY"
---
# ============================================================================
# 3) Bootstrap:创建首个管理员账号(控制台无注册/创建 UI,只能写库)
# ============================================================================
# 密码哈希用仓库自带的 argon2id(console.HashPassword),不要手写。
# 一次性 Job 思路(镜像内含一个生成哈希的小工具,或用下述 SQL 直接插入已算好的哈希):
#
#   -- 先在本地用 console.HashPassword 生成 $argon2id$... 哈希,再:
#   INSERT INTO console_users (email, password_hash, role)
#   VALUES ('admin@klws.cc', '$argon2id$v=19$m=65536,t=1,p=4$....', 'admin');
#
# 注意:role='admin'/'sales' 的行 tenant_id 必须为 NULL;role='customer' 必须带 tenant_id
# (见 0010 migration 的 console_users_tenant_role 约束)。
