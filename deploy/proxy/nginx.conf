worker_processes 1;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP -> HTTPS (Cloudflare also redirects at the edge).
    server {
        listen 80;
        server_name klws.cc *.klws.cc;
        return 301 https://$host$request_uri;
    }

    # TLS termination with the Cloudflare Origin cert; same-origin reverse proxy.
    # NOTE: upstreams are the compose SERVICE NAMES (backend/frontend), not
    # 127.0.0.1 — this config is for the docker-compose network, not host mode.
    server {
        listen 443 ssl;
        http2 on;
        server_name klws.cc *.klws.cc;

        ssl_certificate     /certs/klws.cc.pem;
        ssl_certificate_key /certs/klws.cc.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Docker's embedded DNS. Using variables in proxy_pass (below) forces
        # nginx to re-resolve upstreams per request, so recreating the backend/
        # frontend containers (new IP on redeploy) does NOT strand nginx on a
        # stale IP (which would 502 until a manual proxy restart).
        resolver 127.0.0.11 valid=10s ipv6=off;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Variables here (not literal hostnames) make nginx use the resolver at
        # request time. $request_uri preserves the full path (e.g. /api/v1/...).
        location /api/ {
            set $backend_upstream "backend:8080";
            proxy_pass http://$backend_upstream$request_uri;
        }
        location / {
            set $frontend_upstream "frontend:3000";
            proxy_pass http://$frontend_upstream$request_uri;
        }
    }
}
