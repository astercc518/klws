# klws 全栈生产编排 —— pg + redis + backend(Gin) + frontend(Next) + proxy(nginx)。
#
# 一键起停:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml down
#
# 前置:
#   1. 复制 .env.example -> .env,填好密钥与 DSN(本机可由 /etc/klws/backend.env 派生,
#      把 DSN 主机改成服务名 postgres:5432 / redis:6379)。
#   2. 把 Cloudflare Origin 证书放到 deploy/proxy/certs/{klws.cc.pem,klws.cc.key}。
#   3. 首次起 backend 前数据库需已迁移 + 建好 RLS 角色(app_tenant/app_system)+ 跑 seed,
#      详见 docs/V1.0-HANDOVER-zh.md。
#
# 跑 seed(backend 镜像内含 /seed 二进制,连内网 postgres):
#   docker compose -f docker-compose.prod.yml -f docker-compose.adopt.yml \
#     run --rm --entrypoint /seed backend
#   ⚠️ 必须带 --entrypoint /seed;否则 ENTRYPOINT 是 /console,会被跑成 `/console /seed`
#      (启动 API 服务器而非执行 seed,命令会一直挂住)。
#
# 注意:本编排占用 80/443/5432/6379。若机器上已有 systemd(klws-backend/klws-frontend)
# 或 host 网络的 wadist-proxy 在跑,先停掉它们再 up,避免端口冲突(切换见 README)。
name: klws

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: wadist
    command: ["postgres", "-c", "max_connections=700"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d wadist"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: always
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: klws-console:latest
    restart: always
    env_file:
      - .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    image: klws-frontend:latest
    restart: always
    depends_on:
      - backend
    expose:
      - "3000"

  proxy:
    image: nginx:1.27
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/proxy/certs:/certs:ro

volumes:
  pgdata:
